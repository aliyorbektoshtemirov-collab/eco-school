name: Android APK

# Qo'lda ishga tushiriladi: Actions → Android APK → Run workflow
on:
  workflow_dispatch:
    inputs:
      siteUrl:
        description: "Sayt manzili (https://...)"
        required: true
        default: "https://eco-school.eco-school.workers.dev"
      versionName:
        description: "Versiya nomi"
        required: true
        default: "1.0.0"
      versionCode:
        description: "Versiya raqami (har safar oshirilsin)"
        required: true
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Imzo kaliti
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/eco.jks"
            echo "path=$RUNNER_TEMP/eco.jks" >> "$GITHUB_OUTPUT"
            echo "✅ O'z kalitingiz bilan imzolanadi"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "⚠️ ANDROID_KEYSTORE_BASE64 yo'q — sinov (debug) kaliti ishlatiladi."
            echo "   Bunday APK o'rnatiladi, lekin Play Market uchun yaramaydi."
          fi

      - name: APK yig'ish
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -PsiteUrl='${{ inputs.siteUrl }}' \
            -PappVersionName='${{ inputs.versionName }}' \
            -PappVersionCode='${{ inputs.versionCode }}'

      - name: Imzo barmoq izi
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          unzip -p "$APK" META-INF/*.RSA 2>/dev/null > "$RUNNER_TEMP/cert" || \
            unzip -p "$APK" META-INF/*.EC > "$RUNNER_TEMP/cert"
          echo ""
          echo "================= SHA-256 BARMOQ IZI ================="
          keytool -printcert -file "$RUNNER_TEMP/cert" | grep -i "SHA256:" || true
          echo "======================================================"
          echo "Shu qatorni Cloudflare'dagi ANDROID_FINGERPRINT ga qo'ying,"
          echo "aks holda ilova tepasida brauzer manzil qatori chiqib turadi."

      - uses: actions/upload-artifact@v4
        with:
          name: eco-school-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
