name: Deploy

# main'ga push qilinganda sayt o'zi chiqadi.
# «Actions» bo'limidan qo'lda ham ishga tushirish mumkin.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate:
        description: "Bazaga yangi migratsiyalarni ham qo'llash"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Kutubxonalar
        run: |
          npm ci
          npm ci --prefix web

      - name: Tiplarni tekshirish
        run: npx tsc --noEmit

      - name: Frontendni yig'ish
        run: npm run build --prefix web

      - name: Migratsiyalar
        if: inputs.migrate
        run: npx wrangler d1 migrations apply eco-school-v2 --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Chiqarish
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
